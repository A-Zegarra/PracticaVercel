name: Build MiSaldo temporary APK

on:
  push:
    branches:
      - build/control-gastos-apk-temp
    paths:
      - 'control-gastos/**'
      - '.github/workflows/build-control-gastos-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[apk-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: control-gastos
        run: gradle --no-daemon assembleDebug
      - name: Commit APK
        run: |
          cp control-gastos/app/build/outputs/apk/debug/app-debug.apk MiSaldo-v1.1.0.apk
          sha256sum MiSaldo-v1.1.0.apk > MiSaldo-v1.1.0.sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f MiSaldo-v1.1.0.apk MiSaldo-v1.1.0.sha256.txt
          git commit -m "[apk-output] MiSaldo v1.1.0"
          git push origin HEAD:build/control-gastos-apk-temp
